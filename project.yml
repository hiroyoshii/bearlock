name: BearLock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
packages:
  BearLockCore:
    path: .
schemes:
  BearLock:
    build:
      targets:
        BearLock: all
    test:
      targets:
        - BearLockUITests
  BearLockScreenshot:
    build:
      targets:
        BearLockScreenshot: all
targets:
  BearLock:
    type: application
    platform: iOS
    sources:
      - BearLock/App
      - BearLock/Features
      - BearLock/Services
    dependencies:
      - package: BearLockCore
        product: BearLockCore
      - target: BearLockMonitorExtension
      - target: BearLockShieldConfigurationExtension
      - target: BearLockShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bearlock
        CODE_SIGN_ENTITLEMENTS: BearLock/App/BearLock.entitlements
        INFOPLIST_FILE: BearLock/App/Info.plist
  BearLockScreenshot:
    type: application
    platform: iOS
    sources:
      - BearLock/App
      - BearLock/Features
      - BearLock/Services
    dependencies:
      - package: BearLockCore
        product: BearLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bearlock.screenshot
        INFOPLIST_FILE: BearLock/App/Info.plist
  BearLockMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - BearLock/Extensions/DeviceActivityMonitor
      - BearLock/Services
    dependencies:
      - package: BearLockCore
        product: BearLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bearlock.monitor
        CODE_SIGN_ENTITLEMENTS: BearLock/Extensions/DeviceActivityMonitor/BearLockMonitorExtension.entitlements
        INFOPLIST_FILE: BearLock/Extensions/DeviceActivityMonitor/Info.plist
  BearLockShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - BearLock/Extensions/ShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bearlock.shield-configuration
        CODE_SIGN_ENTITLEMENTS: BearLock/Extensions/ShieldConfiguration/BearLockShieldConfigurationExtension.entitlements
        INFOPLIST_FILE: BearLock/Extensions/ShieldConfiguration/Info.plist
  BearLockShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - BearLock/Extensions/ShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bearlock.shield-action
        CODE_SIGN_ENTITLEMENTS: BearLock/Extensions/ShieldAction/BearLockShieldActionExtension.entitlements
        INFOPLIST_FILE: BearLock/Extensions/ShieldAction/Info.plist
  BearLockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BearLockUITests
    dependencies:
      - target: BearLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bearlock.uitests
        INFOPLIST_FILE: BearLockUITests/Info.plist
        TEST_TARGET_NAME: BearLock
