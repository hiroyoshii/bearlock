name: BearLock
options:
  bundleIdPrefix: com.hiyozoo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "3M4M7DRUZY"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BearLockCore:
    path: .
schemes:
  BearLockLogic:
    build:
      targets:
        BearLockPurchaseTestHost: all
        BearLockLogicTests: all
    test:
      targets:
        - BearLockLogicTests
  BearLockPurchases:
    build:
      targets:
        BearLockPurchaseTestHost: all
        BearLockPurchaseTests: all
    run:
      config: Debug
      storeKitConfiguration: BearLockPurchaseTests/SupportProducts.storekit
    test:
      targets:
        - BearLockPurchaseTests
  BearLock:
    build:
      targets:
        BearLock: all
    test:
      targets:
        - BearLockUITests
  BearLockScreenshot:
    build:
      targets:
        BearLockScreenshot: all
targets:
  BearLock:
    type: application
    platform: iOS
    sources:
      - BearLock/App
      - BearLock/Features
      - BearLock/Features/TargetSelection
      - BearLock/Services
    dependencies:
      - package: BearLockCore
        product: BearLockCore
      - target: BearLockMonitorExtension
      - target: BearLockShieldConfigurationExtension
      - target: BearLockShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock
        CODE_SIGN_ENTITLEMENTS: BearLock/App/BearLock.entitlements
        INFOPLIST_FILE: BearLock/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BearLock AppStore App
  BearLockScreenshot:
    type: application
    platform: iOS
    sources:
      - BearLock/App
      - BearLock/Features
      - BearLock/Features/TargetSelection
      - BearLock/Services
    dependencies:
      - package: BearLockCore
        product: BearLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.screenshot
        INFOPLIST_FILE: BearLock/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  BearLockMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - BearLock/Extensions/DeviceActivityMonitor
      - BearLock/Services
    dependencies:
      - package: BearLockCore
        product: BearLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.monitor
        CODE_SIGN_ENTITLEMENTS: BearLock/Extensions/DeviceActivityMonitor/BearLockMonitorExtension.entitlements
        INFOPLIST_FILE: BearLock/Extensions/DeviceActivityMonitor/Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BearLock AppStore Monitor
  BearLockShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - BearLock/Extensions/ShieldConfiguration
      - path: BearLock/Services/AppGroup.swift
      - path: BearLock/Services/ShieldController.swift
      - path: BearLock/Services/DiagnosticsLogger.swift
      - path: BearLock/Services/TargetSelectionStore.swift
      - path: BearLock/Services/Localization.swift
    dependencies:
      - package: BearLockCore
        product: BearLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.shieldconfiguration
        CODE_SIGN_ENTITLEMENTS: BearLock/Extensions/ShieldConfiguration/BearLockShieldConfigurationExtension.entitlements
        INFOPLIST_FILE: BearLock/Extensions/ShieldConfiguration/Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BearLock AppStore ShieldConfiguration
  BearLockShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - BearLock/Extensions/ShieldAction
      - BearLock/Services
    dependencies:
      - package: BearLockCore
        product: BearLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.shieldaction
        CODE_SIGN_ENTITLEMENTS: BearLock/Extensions/ShieldAction/BearLockShieldActionExtension.entitlements
        INFOPLIST_FILE: BearLock/Extensions/ShieldAction/Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BearLock AppStore ShieldAction
  BearLockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BearLockUITests
    dependencies:
      - target: BearLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.uitests
        INFOPLIST_FILE: BearLockUITests/Info.plist
        TEST_TARGET_NAME: BearLock

  BearLockPurchaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BearLockPurchaseTests
      - BearLock/Features/Home/SupportStore.swift
      - BearLock/Features/Home/WakePurchaseStore.swift
      - BearLock/Services/DiagnosticsLogger.swift
      - BearLock/Services/Localization.swift
    dependencies:
      - target: BearLockPurchaseTestHost
      - package: BearLockCore
        product: BearLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.purchase-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  BearLockPurchaseTestHost:
    type: application
    platform: iOS
    sources:
      - BearLockPurchaseTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.purchase-test-host
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"

  BearLockLogicTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: BearLockPurchaseTestHost
      - package: BearLockCore
        product: BearLockCore
    sources:
      - BearLockLogicTests
      - BearLock/App/BearLockAppModel.swift
      - BearLock/App/BearLockSafetyPolicy.swift
      - BearLock/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiyozoo.bearlock.logic-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
