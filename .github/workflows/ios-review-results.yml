name: Collect iOS review results

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-review-results.yml']
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full source commit SHA to review'
        required: true
        default: '9ab551df53f6bb4220a4b9df53a656ca9f00b928'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read iOS runs, jobs, and bounded log excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_COMMIT: ${{ inputs.commit || '9ab551df53f6bb4220a4b9df53a656ca9f00b928' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          sha = os.environ['REVIEW_COMMIT']
          assert re.fullmatch(r'[0-9a-fA-F]{40}', sha), 'A full commit SHA is required'
          repo = os.environ['REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))
          deadline = time.monotonic() + 15 * 60
          while True:
              runs = [r for r in api(f'actions/runs?head_sha={sha}&per_page=100')['workflow_runs']
                      if r['name'].startswith('iOS ') and r['event'] == 'push']
              if not runs or all(r['status'] == 'completed' for r in runs) or time.monotonic() >= deadline:
                  break
              time.sleep(30)
          output = Path('ci-results/ios-review') / sha
          output.mkdir(parents=True, exist_ok=True)
          report = {'sourceCommit': sha, 'collectedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), 'runs': []}
          pattern = re.compile(r'error:|warning:|Test Case .* (passed|failed)|Test Suite |Executed \d+ tests|\*\*.*(SUCCEEDED|FAILED)|fatal error|Assertion|Failing tests|Testing failed|Error:')
          for run in runs:
              jobs = api(f"actions/runs/{run['id']}/attempts/{run['run_attempt']}/jobs?per_page=100")['jobs']
              item = {k: run[k] for k in ['id', 'name', 'head_sha', 'status', 'conclusion', 'html_url', 'run_attempt']}
              item['jobs'] = [{k: j[k] for k in ['name', 'status', 'conclusion', 'html_url', 'steps']} for j in jobs]
              report['runs'].append(item)
              if run['status'] == 'completed':
                  log = subprocess.run(['gh', 'run', 'view', str(run['id']), '--repo', repo, '--attempt', str(run['run_attempt']), '--log'], capture_output=True, text=True)
                  lines = [line for line in log.stdout.splitlines() if pattern.search(line)]
                  (output / f"{run['id']}.txt").write_text('\n'.join(lines[-600:]) + '\n')
                  item['logReadExitCode'] = log.returncode
                  item['matchingLogLines'] = len(lines)
          (output / 'summary.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Save evidence on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/ios-review
          git diff --cached --quiet && exit 0
          git commit -m 'Record iOS review results [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
