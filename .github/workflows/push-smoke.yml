name: Push Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Push Trigger Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm push trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
