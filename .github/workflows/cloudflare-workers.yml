name: Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/configure_stripe.py"
      - "tools/tests/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-workers.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/configure_stripe.py"
      - "tools/tests/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-workers.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test payment link configuration
        run: python3 -m unittest discover -s tools/tests -v

      - name: Configure Stripe checkout
        env:
          BEARLOCK_STRIPE_PAYMENT_LINK: ${{ vars.BEARLOCK_STRIPE_PAYMENT_LINK }}
        run: |
          if [ -n "$BEARLOCK_STRIPE_PAYMENT_LINK" ]; then
            python3 tools/configure_stripe.py --require-live
          else
            env -u BEARLOCK_STRIPE_PAYMENT_LINK python3 tools/configure_stripe.py
          fi

      - name: Validate static files
        run: |
          test -f site/index.html
          test -f site/privacy/index.html
          test -f site/support/index.html
          test -f site/en/index.html
          test -f site/en/privacy/index.html
          test -f site/en/support/index.html
          test -f site/styles.css
          test -f site/support/development/index.html
          test -f site/en/support/development/index.html
          test -f site/support/thanks/index.html
          test -f site/en/support/thanks/index.html
          test -f site/commerce/index.html
          test -f site/en/commerce/index.html

      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN_VALUE != '' && env.CLOUDFLARE_ACCOUNT_ID_VALUE != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN_VALUE }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID_VALUE }}
          command: deploy

      - name: Skip deploy without Cloudflare secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN_VALUE == '' || env.CLOUDFLARE_ACCOUNT_ID_VALUE == '' }}
        run: echo "Cloudflare Workers deploy skipped because secrets are not configured."
