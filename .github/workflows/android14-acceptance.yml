name: Android 14 Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-lab/**', 'Tests/ContractFixtures/**', '.github/workflows/android14-acceptance.yml']
permissions:
  contents: read
concurrency:
  group: android14-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADB: adb
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit test
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          ./android-lab/gradlew -p android-lab :product:assembleDebug :probe:assembleDebug :product:testDebugUnitTest --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real behavior on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            adb install -r android-lab/product/build/outputs/apk/debug/product-debug.apk
            adb install -r android-lab/probe/build/outputs/apk/debug/probe-debug.apk
            mkdir -p artifacts/android14
            adb shell am instrument -w com.hiyozoo.bearlock/.PickerInstrumentation > artifacts/android14/picker-test.log
            cat artifacts/android14/picker-test.log
            grep -q 'PASS: 1000 apps' artifacts/android14/picker-test.log
            adb shell am instrument -w com.hiyozoo.bearlock/.LockInstrumentation > artifacts/android14/lock-test.log
            cat artifacts/android14/lock-test.log
            grep -q 'PASS: lock failure recovery' artifacts/android14/lock-test.log
            adb shell am instrument -w com.hiyozoo.bearlock/.EditorInstrumentation > artifacts/android14/editor-test.log
            cat artifacts/android14/editor-test.log
            grep -q 'PASS: editor recreation' artifacts/android14/editor-test.log
            adb shell am instrument -w com.hiyozoo.bearlock/.RecoveryInstrumentation > artifacts/android14/recovery-test.log
            cat artifacts/android14/recovery-test.log
            grep -q 'PASS: monitoring recovery UI' artifacts/android14/recovery-test.log
            BEARLOCK_DISPOSABLE_QA=1 python3 android-lab/scripts/product_recurring_delete_verify.py
            BEARLOCK_DISPOSABLE_QA=1 python3 android-lab/scripts/product_recurring_verify.py
            BEARLOCK_DISPOSABLE_QA=1 python3 android-lab/scripts/onboarding_verify.py > artifacts/android14/onboarding-run.log 2>&1
            python3 android-lab/scripts/android14_verify.py
            python3 android-lab/scripts/permission_scope_verify.py
            BEARLOCK_QA_WITHOUT_EXACT_ALARM=1 BEARLOCK_PROBE_OUT=artifacts/android14/without-exact-alarm python3 android-lab/scripts/product_verify.py
            BEARLOCK_QA_WITHOUT_EXACT_ALARM=1 BEARLOCK_QA_SLEEP_THROUGH_EXPIRY=1 BEARLOCK_PROBE_OUT=artifacts/android14/without-exact-alarm-sleep python3 android-lab/scripts/product_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bearlock-android14-acceptance
          path: |
            artifacts/android14/
            android-lab/product/build/test-results/
