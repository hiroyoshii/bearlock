name: Android 14 Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-lab/**', '.github/workflows/android14-acceptance.yml']
permissions:
  contents: write
concurrency:
  group: android14-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADB: adb
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit test
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          ./android-lab/gradlew -p android-lab :product:assembleDebug :probe:assembleDebug :product:testDebugUnitTest --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real behavior on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            adb install -r android-lab/product/build/outputs/apk/debug/product-debug.apk
            adb install -r android-lab/probe/build/outputs/apk/debug/probe-debug.apk
            python3 android-lab/scripts/android14_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bearlock-android14-acceptance
          path: |
            artifacts/android14/
            android-lab/product/build/test-results/
      - name: Save evidence
        if: always() && github.ref == 'refs/heads/main'
        run: |
          test -f artifacts/android14/result.json || exit 0
          mkdir -p ci-results/android14
          cp -R artifacts/android14/. ci-results/android14/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/android14
          git diff --cached --quiet && exit 0
          git commit -m 'Record Android 14 acceptance result [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
