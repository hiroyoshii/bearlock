name: Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Static Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static files
        run: |
          test -f site/index.html
          test -f site/privacy/index.html
          test -f site/support/index.html
          test -f site/en/index.html
          test -f site/en/privacy/index.html
          test -f site/en/support/index.html
          test -f site/styles.css

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN_VALUE != '' && env.CLOUDFLARE_ACCOUNT_ID_VALUE != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN_VALUE }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID_VALUE }}
          command: pages deploy site --project-name bearlock --branch ${{ github.head_ref || github.ref_name }}

      - name: Skip deploy without Cloudflare secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN_VALUE == '' || env.CLOUDFLARE_ACCOUNT_ID_VALUE == '' }}
        run: echo "Cloudflare Pages deploy skipped because secrets are not configured."
