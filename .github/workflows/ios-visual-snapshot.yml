name: iOS Visual Snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-visual-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    name: Build Screenshot App
    runs-on: macos-15
    timeout-minutes: 25

    env:
      PROJECT: BearLock.xcodeproj
      SCREENSHOT_SCHEME: BearLockScreenshot
      SCREENSHOT_BUNDLE_ID: com.hiyozoo.bearlock.screenshot
      DERIVED_DATA: DerivedData
      SCREENSHOT_PATH: artifacts/bearlock-simulator.png
      SCREENSHOT_DIR: artifacts/screenshots
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Validate project metadata
        run: bash Scripts/validate-ios-project.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build screenshot app for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCREENSHOT_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-screenshot-build.log

      - name: Capture launched app screenshots
        run: |
          set -euo pipefail
          mkdir -p artifacts "$SCREENSHOT_DIR"
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -name BearLockScreenshot.app -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "BearLockScreenshot.app was not found in DerivedData."
            exit 1
          fi

          find_device_udid() {
            local device_name="$1"
            xcrun simctl list devices available -j | python3 -c 'import json, sys; name = sys.argv[1]; data = json.load(sys.stdin); matches = [device["udid"] for devices in data.get("devices", {}).values() for device in devices if device.get("isAvailable") and device.get("name") == name]; print(matches[0] if matches else "")' "$device_name"
          }

          capture_locale() {
            local device_name="$1"
            local base_label="$2"
            local locale_label="$3"
            shift 3
            local udid
            udid="$(find_device_udid "$device_name")"

            if [ -z "$udid" ]; then
              echo "Simulator not found, skipping screenshots for $device_name."
              return 0
            fi

            local label="${base_label}-${locale_label}"
            mkdir -p "$SCREENSHOT_DIR/$label"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"

            for screen in setup home confirmation activeLock settings diagnostics; do
              xcrun simctl terminate "$udid" "$SCREENSHOT_BUNDLE_ID" || true
              xcrun simctl launch "$udid" "$SCREENSHOT_BUNDLE_ID" --ui-testing --screenshot "$screen" "$@"
              sleep 3
              xcrun simctl io "$udid" screenshot "$SCREENSHOT_DIR/$label/$screen.png"
              test -s "$SCREENSHOT_DIR/$label/$screen.png"
              file "$SCREENSHOT_DIR/$label/$screen.png"
            done
          }

          capture_device() {
            local device_name="$1"
            local label="$2"
            capture_locale "$device_name" "$label" "en"
            capture_locale "$device_name" "$label" "ja" -AppleLanguages "(ja)" -AppleLocale "ja_JP"
          }

          capture_device "iPhone 16" "iphone-16"

          test -s "$SCREENSHOT_DIR/iphone-16-en/setup.png"
          cp "$SCREENSHOT_DIR/iphone-16-en/setup.png" "$SCREENSHOT_PATH"
          test -s "$SCREENSHOT_PATH"
          file "$SCREENSHOT_PATH"
          shasum -a 256 "$SCREENSHOT_PATH"

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearlock-ios-visual-snapshots
          path: artifacts
          if-no-files-found: error
