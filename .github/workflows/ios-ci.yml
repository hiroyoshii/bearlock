name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshot:
    name: Build, Test, Screenshot
    runs-on: macos-15
    timeout-minutes: 45

    env:
      PROJECT: BearLock.xcodeproj
      SCHEME: BearLock
      DERIVED_DATA: DerivedData
      RESULT_BUNDLE: artifacts/BearLockUITests.xcresult
      SCREENSHOT_PATH: artifacts/bearlock-simulator.png
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run core Swift package tests
        run: swift test

      - name: Build app and extensions for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-build.log

      - name: Run UI launch test with screenshot attachment
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee artifacts/xcodebuild-test.log

      - name: Capture launched app screenshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ { print $2; exit }')"
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -name BearLock.app -type d | head -n 1)"

          if [ -z "$UDID" ]; then
            echo "No available iPhone 16 simulator found."
            exit 1
          fi

          if [ -z "$APP_PATH" ]; then
            echo "BearLock.app was not found in DerivedData."
            exit 1
          fi

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.example.bearlock --ui-testing
          sleep 5
          xcrun simctl io "$UDID" screenshot "$SCREENSHOT_PATH"
          test -s "$SCREENSHOT_PATH"
          file "$SCREENSHOT_PATH"
          shasum -a 256 "$SCREENSHOT_PATH"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearlock-ios-ci-artifacts
          path: |
            artifacts
            DerivedData/Logs/Test
          if-no-files-found: warn
