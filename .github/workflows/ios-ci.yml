name: iOS CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "ci-screenshots/**"
      - "site/**"
      - "todo.md"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-workers.yml"
  pull_request:
    paths-ignore:
      - "ci-screenshots/**"
      - "site/**"
      - "todo.md"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshot:
    name: Build, Test, Screenshot
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT: BearLock.xcodeproj
      SCHEME: BearLock
      SCREENSHOT_SCHEME: BearLockScreenshot
      SCREENSHOT_BUNDLE_ID: com.hiyozoo.bearlock.screenshot
      DERIVED_DATA: DerivedData
      E2E_RESULT_BUNDLE: artifacts/BearLockE2ETests.xcresult
      E2E_SCREENSHOT_DIR: artifacts/e2e-screenshots
      SCREENSHOT_PATH: artifacts/bearlock-simulator.png
      SCREENSHOT_DIR: artifacts/screenshots
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Validate project metadata
        run: bash Scripts/validate-ios-project.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run core Swift package tests
        run: swift test

      - name: Cross-process repository transactions
        run: python3 Scripts/test-lock-repository-processes.py

      - name: App model integration tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme BearLockLogic \
            -destination "$DESTINATION" \
            -resultBundlePath artifacts/logic-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee artifacts/xcodebuild-logic-tests.log

      - name: Build Release app and extensions for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-release-build.log

      - name: Build app and extensions for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-build.log

      - name: Compile UI test bundle
        id: ui-test-build
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing | tee artifacts/xcodebuild-ui-test-build.log

      - name: Prepare mock UI e2e artifacts
        run: |
          mkdir -p artifacts "$E2E_SCREENSHOT_DIR"
          rm -rf /tmp/bearlock-e2e-screenshots

      - name: Run mock UI e2e
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$E2E_RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building | tee artifacts/xcodebuild-ui-e2e.log

      - name: Run selection UI e2e on small iPhone
        if: ${{ !cancelled() && steps.ui-test-build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; ios=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("platform") == "iOS"]; print(sorted(ios, key=lambda r: [int(n) for n in r["version"].split(".")])[-1]["identifier"])')"
          small_udid="$(xcrun simctl create 'BearLock Small iPhone' com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime_id")"
          xcrun simctl shutdown all
          xcrun simctl boot "$small_udid"
          xcrun simctl bootstatus "$small_udid" -b
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$small_udid" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath artifacts/selection-small-iphone.xcresult \
            -only-testing:BearLockUITests/SelectionControlsUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building | tee artifacts/xcodebuild-selection-small-iphone.log

      - name: Collect mock UI e2e screenshots
        if: always()
        run: |
          if [ -d /tmp/bearlock-e2e-screenshots ]; then
            cp /tmp/bearlock-e2e-screenshots/*.png "$E2E_SCREENSHOT_DIR"/ || true
          fi

      - name: Build screenshot app for simulator
        if: ${{ !cancelled() && steps.ui-test-build.outcome == 'success' }}
        id: screenshot-build
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCREENSHOT_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-screenshot-build.log

      - name: Capture launched app screenshot
        if: ${{ !cancelled() && steps.screenshot-build.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts "$SCREENSHOT_DIR"
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -name BearLockScreenshot.app -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "BearLock.app was not found in DerivedData."
            exit 1
          fi

          find_device_udid() {
            local device_name="$1"
            xcrun simctl list devices available -j | python3 -c 'import json, sys; name = sys.argv[1]; data = json.load(sys.stdin); matches = [device["udid"] for devices in data.get("devices", {}).values() for device in devices if device.get("isAvailable") and device.get("name") == name]; print(matches[0] if matches else "")' "$device_name"
          }

          choose_app_store_device() {
            for device_name in "iPhone 14 Plus" "iPhone 13 Pro Max" "iPhone 12 Pro Max" "iPhone 11 Pro Max" "iPhone XS Max"; do
              if [ -n "$(find_device_udid "$device_name")" ]; then
                echo "$device_name"
                return 0
              fi

              runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; data=json.load(sys.stdin); ios=[r for r in data.get("runtimes", []) if r.get("isAvailable") and r.get("platform") == "iOS"]; ios.sort(key=lambda r: r.get("version", "")); print(ios[-1]["identifier"] if ios else "")')"
              if [ -n "$runtime_id" ] && xcrun simctl create "$device_name" "$device_name" "$runtime_id" >/dev/null 2>&1; then
                echo "$device_name"
                return 0
              fi
            done

            echo "No App Store screenshot simulator was found." >&2
            xcrun simctl list devices available >&2
            return 1
          }

          capture_locale() {
            local device_name="$1"
            local base_label="$2"
            local locale_label="$3"
            shift 3
            local udid
            udid="$(find_device_udid "$device_name")"

            if [ -z "$udid" ]; then
              echo "Simulator not found, skipping screenshots for $device_name."
              return 0
            fi

            local label="${base_label}-${locale_label}"
            mkdir -p "$SCREENSHOT_DIR/$label"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"

            for screen in setup home composeNow composeDelayed composeDate composeRepeat confirmation scheduledList activeLock wakeOptions wakeResult scheduledEditor recurringEditor settings support diagnostics; do
              local screenshot_path="$SCREENSHOT_DIR/$label/$screen.png"
              local screenshot_size=0
              xcrun simctl terminate "$udid" "$SCREENSHOT_BUNDLE_ID" || true
              local launch_output
              launch_output="$(xcrun simctl launch "$udid" "$SCREENSHOT_BUNDLE_ID" --ui-testing --screenshot "$screen" "$@")"
              echo "$launch_output"
              local launched_app_pid="${launch_output##*: }"
              [[ "$launched_app_pid" =~ ^[0-9]+$ ]]
              for attempt in 1 2 3; do
                sleep $((attempt + 2))
                kill -0 "$launched_app_pid"
                xcrun simctl io "$udid" screenshot "$screenshot_path"
                screenshot_size="$(stat -f%z "$screenshot_path")"
                if [ "$screenshot_size" -ge 100000 ]; then
                  break
                fi
                echo "Screenshot appears blank; retrying $label/$screen (attempt $attempt, $screenshot_size bytes)."
              done
              test "$screenshot_size" -ge 100000
              file "$screenshot_path"
            done
          }

          validate_app_store_screenshot_sizes() {
            local failures=0
            while IFS= read -r screenshot; do
              local width
              local height
              width="$(sips -g pixelWidth "$screenshot" | awk '/pixelWidth/ { print $2 }')"
              height="$(sips -g pixelHeight "$screenshot" | awk '/pixelHeight/ { print $2 }')"
              case "${width}x${height}" in
                1242x2688|2688x1242|1284x2778|2778x1284)
                  echo "Valid App Store screenshot size: $screenshot ${width}x${height}"
                  ;;
                *)
                  echo "Unexpected App Store screenshot size: $screenshot ${width}x${height}"
                  failures=1
                  ;;
              esac
            done < <(find "$SCREENSHOT_DIR" -path "*/iphone-app-store-*/*.png" -type f | sort)

            if [ "$failures" -ne 0 ]; then
              return 1
            fi
          }

          capture_device() {
            local device_name="$1"
            local label="$2"
            capture_locale "$device_name" "$label" "en"
            capture_locale "$device_name" "$label" "ja" -AppleLanguages "(ja)" -AppleLocale "ja_JP"
          }

          APP_STORE_DEVICE_NAME="$(choose_app_store_device)"
          xcrun simctl shutdown all
          echo "Capturing App Store screenshots on $APP_STORE_DEVICE_NAME"
          capture_device "$APP_STORE_DEVICE_NAME" "iphone-app-store"
          validate_app_store_screenshot_sizes

          test -s "$SCREENSHOT_DIR/iphone-app-store-en/setup.png"
          cp "$SCREENSHOT_DIR/iphone-app-store-en/setup.png" "$SCREENSHOT_PATH"
          test -s "$SCREENSHOT_PATH"
          file "$SCREENSHOT_PATH"
          shasum -a 256 "$SCREENSHOT_PATH"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearlock-ios-ci-artifacts
          path: |
            artifacts/*.xcresult
            artifacts/*.log
            artifacts/*.png
            artifacts/e2e-screenshots/*.png
            artifacts/screenshots/**/*.png
          if-no-files-found: warn

  storekit:
    name: StoreKit purchase tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run StoreKit tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild -project BearLock.xcodeproj -scheme BearLockPurchases \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest' -parallel-testing-enabled NO \
            -resultBundlePath artifacts/purchases.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee artifacts/purchases.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storekit-purchase-results
          path: artifacts/
