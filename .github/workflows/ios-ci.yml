name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshot:
    name: Build, Test, Screenshot
    runs-on: macos-15
    timeout-minutes: 45

    env:
      PROJECT: BearLock.xcodeproj
      SCHEME: BearLock
      SCREENSHOT_SCHEME: BearLockScreenshot
      SCREENSHOT_BUNDLE_ID: com.example.bearlock.screenshot
      DERIVED_DATA: DerivedData
      RESULT_BUNDLE: artifacts/BearLockUITests.xcresult
      E2E_RESULT_BUNDLE: artifacts/BearLockE2ETests.xcresult
      E2E_SCREENSHOT_DIR: artifacts/e2e-screenshots
      SCREENSHOT_PATH: artifacts/bearlock-simulator.png
      SCREENSHOT_DIR: artifacts/screenshots
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Validate project metadata
        run: bash Scripts/validate-ios-project.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run core Swift package tests
        run: swift test

      - name: Build app and extensions for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-build.log

      - name: Compile UI test bundle
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing | tee artifacts/xcodebuild-ui-test-build.log

      - name: Prepare mock UI e2e artifacts
        run: |
          mkdir -p artifacts "$E2E_SCREENSHOT_DIR"
          rm -rf /tmp/bearlock-e2e-screenshots

      - name: Run setup screen UI e2e
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "artifacts/BearLockE2E-setup.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testLaunchSetupScreenAndCaptureScreenshot \
            test-without-building | tee artifacts/xcodebuild-ui-e2e-setup.log || touch artifacts/e2e-setup.failed

      - name: Run immediate lock UI e2e
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "artifacts/BearLockE2E-immediate.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testCreateImmediateLockWithMockServices \
            test-without-building | tee artifacts/xcodebuild-ui-e2e-immediate.log || touch artifacts/e2e-immediate.failed

      - name: Run delayed lock UI e2e
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "artifacts/BearLockE2E-delayed.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testScheduleEditAndDeleteDelayedLockWithMockServices \
            test-without-building | tee artifacts/xcodebuild-ui-e2e-delayed.log || touch artifacts/e2e-delayed.failed

      - name: Run recurring lock UI e2e
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "artifacts/BearLockE2E-recurring.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testCreateAndOpenRecurringEditorWithMockServices \
            test-without-building | tee artifacts/xcodebuild-ui-e2e-recurring.log || touch artifacts/e2e-recurring.failed

      - name: Run disabled recurring UI e2e
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "artifacts/BearLockE2E-disabled-recurring.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testDisabledRecurringSeedShowsOffStateWithMockServices \
            test-without-building | tee artifacts/xcodebuild-ui-e2e-disabled-recurring.log || touch artifacts/e2e-disabled-recurring.failed

      - name: Run active lock constraint UI e2e
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "artifacts/BearLockE2E-active-lock.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testActiveLockHidesMutableControlsWithMockServices \
            test-without-building | tee artifacts/xcodebuild-ui-e2e-active-lock.log || touch artifacts/e2e-active-lock.failed

      - name: Collect mock UI e2e screenshots
        run: |
          if [ -d /tmp/bearlock-e2e-screenshots ]; then
            cp /tmp/bearlock-e2e-screenshots/*.png "$E2E_SCREENSHOT_DIR"/ || true
          fi
          for screenshot in \
            e2e-immediate-active-lock.png \
            e2e-delayed-deleted.png \
            e2e-recurring-disabled-list.png \
            e2e-active-lock-constraints.png
          do
            if [ ! -s "$E2E_SCREENSHOT_DIR/$screenshot" ]; then
              echo "Missing e2e screenshot: $screenshot"
              touch "artifacts/missing-$screenshot.failed"
            fi
          done

      - name: Build screenshot app for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCREENSHOT_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-screenshot-build.log

      - name: Capture launched app screenshot
        run: |
          set -euo pipefail
          mkdir -p artifacts "$SCREENSHOT_DIR"
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -name BearLockScreenshot.app -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "BearLock.app was not found in DerivedData."
            exit 1
          fi

          find_device_udid() {
            local device_name="$1"
            xcrun simctl list devices available -j | python3 -c 'import json, sys; name = sys.argv[1]; data = json.load(sys.stdin); matches = [device["udid"] for devices in data.get("devices", {}).values() for device in devices if device.get("isAvailable") and device.get("name") == name]; print(matches[0] if matches else "")' "$device_name"
          }

          capture_device() {
            local device_name="$1"
            local label="$2"
            local udid
            udid="$(find_device_udid "$device_name")"

            if [ -z "$udid" ]; then
              echo "Simulator not found, skipping screenshots for $device_name."
              return 0
            fi

            mkdir -p "$SCREENSHOT_DIR/$label"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"

            for screen in setup home composeNow composeDelayed composeDate composeRepeat confirmation scheduledList activeLock scheduledEditor recurringEditor settings; do
              xcrun simctl terminate "$udid" "$SCREENSHOT_BUNDLE_ID" || true
              xcrun simctl launch "$udid" "$SCREENSHOT_BUNDLE_ID" --ui-testing --screenshot "$screen"
              sleep 3
              xcrun simctl io "$udid" screenshot "$SCREENSHOT_DIR/$label/$screen.png"
              test -s "$SCREENSHOT_DIR/$label/$screen.png"
              file "$SCREENSHOT_DIR/$label/$screen.png"
            done
          }

          capture_device "iPhone 16" "iphone-16"

          test -s "$SCREENSHOT_DIR/iphone-16/setup.png"
          cp "$SCREENSHOT_DIR/iphone-16/setup.png" "$SCREENSHOT_PATH"
          test -s "$SCREENSHOT_PATH"
          file "$SCREENSHOT_PATH"
          shasum -a 256 "$SCREENSHOT_PATH"

      - name: Assert mock UI e2e passed
        run: |
          if compgen -G "artifacts/e2e-*.failed" > /dev/null || compgen -G "artifacts/missing-*.failed" > /dev/null; then
            echo "Mock UI e2e failures:"
            ls -1 artifacts/*.failed
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearlock-ios-ci-artifacts
          path: |
            artifacts
            DerivedData/Logs/Test
          if-no-files-found: warn
