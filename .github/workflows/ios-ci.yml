name: iOS CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "ci-screenshots/**"
      - "docs/**"
      - "site/**"
      - "todo.md"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-workers.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ios-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshot:
    name: Build, Test, Screenshot
    runs-on: macos-15
    timeout-minutes: 45

    env:
      PROJECT: BearLock.xcodeproj
      SCHEME: BearLock
      SCREENSHOT_SCHEME: BearLockScreenshot
      SCREENSHOT_BUNDLE_ID: com.hiyozoo.bearlock.screenshot
      DERIVED_DATA: DerivedData
      RESULT_BUNDLE: artifacts/BearLockUITests.xcresult
      E2E_RESULT_BUNDLE: artifacts/BearLockE2ETests.xcresult
      E2E_SCREENSHOT_DIR: artifacts/e2e-screenshots
      RUN_MOCK_E2E: "true"
      SCREENSHOT_PATH: artifacts/bearlock-simulator.png
      SCREENSHOT_DIR: artifacts/screenshots
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Validate project metadata
        run: bash Scripts/validate-ios-project.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run core Swift package tests
        run: swift test

      - name: Build app and extensions for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-build.log

      - name: Compile UI test bundle
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing | tee artifacts/xcodebuild-ui-test-build.log

      - name: Prepare mock UI e2e artifacts
        if: env.RUN_MOCK_E2E == 'true'
        run: |
          mkdir -p artifacts "$E2E_SCREENSHOT_DIR"
          rm -rf /tmp/bearlock-e2e-screenshots

      - name: Run mock UI e2e
        if: env.RUN_MOCK_E2E == 'true'
        timeout-minutes: 25
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$E2E_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testLaunchSetupScreenAndCaptureScreenshot \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testCreateImmediateLockWithMockServices \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testRecentTargetsSelectionFeedbackAndActions \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testApprovedHomeWithoutSelectionShowsTargetPickerEntryPoint \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testScheduleEditAndDeleteDelayedLockWithMockServices \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testCreateAndOpenRecurringEditorWithMockServices \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testDisabledRecurringSeedShowsOffStateWithMockServices \
            -only-testing:BearLockUITests/BearLockLaunchUITests/testActiveLockHidesMutableControlsWithMockServices \
            test-without-building | tee artifacts/xcodebuild-ui-e2e.log || touch artifacts/e2e-ui.failed

      - name: Collect mock UI e2e screenshots
        if: env.RUN_MOCK_E2E == 'true'
        run: |
          if [ -d /tmp/bearlock-e2e-screenshots ]; then
            cp /tmp/bearlock-e2e-screenshots/*.png "$E2E_SCREENSHOT_DIR"/ || true
          fi
          for screenshot in \
            e2e-immediate-active-lock.png \
            e2e-recent-target-selected.png \
            e2e-recent-target-deleted.png \
            e2e-delayed-deleted.png \
            e2e-recurring-disabled-list.png \
            e2e-active-lock-constraints.png
          do
            if [ ! -s "$E2E_SCREENSHOT_DIR/$screenshot" ]; then
              echo "Missing e2e screenshot: $screenshot"
              touch "artifacts/missing-$screenshot.failed"
            fi
          done

      - name: Build screenshot app for simulator
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCREENSHOT_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee artifacts/xcodebuild-screenshot-build.log

      - name: Capture launched app screenshot
        run: |
          set -euo pipefail
          mkdir -p artifacts "$SCREENSHOT_DIR"
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -name BearLockScreenshot.app -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "BearLock.app was not found in DerivedData."
            exit 1
          fi

          find_device_udid() {
            local device_name="$1"
            xcrun simctl list devices available -j | python3 -c 'import json, sys; name = sys.argv[1]; data = json.load(sys.stdin); matches = [device["udid"] for devices in data.get("devices", {}).values() for device in devices if device.get("isAvailable") and device.get("name") == name]; print(matches[0] if matches else "")' "$device_name"
          }

          choose_app_store_device() {
            for device_name in "iPhone 14 Plus" "iPhone 13 Pro Max" "iPhone 12 Pro Max" "iPhone 11 Pro Max" "iPhone XS Max"; do
              if [ -n "$(find_device_udid "$device_name")" ]; then
                echo "$device_name"
                return 0
              fi

              runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; data=json.load(sys.stdin); ios=[r for r in data.get("runtimes", []) if r.get("isAvailable") and r.get("platform") == "iOS"]; ios.sort(key=lambda r: r.get("version", "")); print(ios[-1]["identifier"] if ios else "")')"
              if [ -n "$runtime_id" ] && xcrun simctl create "$device_name" "$device_name" "$runtime_id" >/dev/null 2>&1; then
                echo "$device_name"
                return 0
              fi
            done

            echo "No App Store screenshot simulator was found." >&2
            xcrun simctl list devices available >&2
            return 1
          }

          capture_locale() {
            local device_name="$1"
            local base_label="$2"
            local locale_label="$3"
            shift 3
            local udid
            udid="$(find_device_udid "$device_name")"

            if [ -z "$udid" ]; then
              echo "Simulator not found, skipping screenshots for $device_name."
              return 0
            fi

            local label="${base_label}-${locale_label}"
            mkdir -p "$SCREENSHOT_DIR/$label"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"

            for screen in setup home composeNow composeDelayed composeDate composeRepeat confirmation scheduledList activeLock scheduledEditor recurringEditor settings diagnostics; do
              xcrun simctl terminate "$udid" "$SCREENSHOT_BUNDLE_ID" || true
              xcrun simctl launch "$udid" "$SCREENSHOT_BUNDLE_ID" --ui-testing --screenshot "$screen" "$@"
              sleep 3
              xcrun simctl io "$udid" screenshot "$SCREENSHOT_DIR/$label/$screen.png"
              test -s "$SCREENSHOT_DIR/$label/$screen.png"
              file "$SCREENSHOT_DIR/$label/$screen.png"
            done
          }

          validate_app_store_screenshot_sizes() {
            local failures=0
            while IFS= read -r screenshot; do
              local width
              local height
              width="$(sips -g pixelWidth "$screenshot" | awk '/pixelWidth/ { print $2 }')"
              height="$(sips -g pixelHeight "$screenshot" | awk '/pixelHeight/ { print $2 }')"
              case "${width}x${height}" in
                1242x2688|2688x1242|1284x2778|2778x1284)
                  echo "Valid App Store screenshot size: $screenshot ${width}x${height}"
                  ;;
                *)
                  echo "Unexpected App Store screenshot size: $screenshot ${width}x${height}"
                  failures=1
                  ;;
              esac
            done < <(find "$SCREENSHOT_DIR" -path "*/iphone-app-store-*/*.png" -type f | sort)

            if [ "$failures" -ne 0 ]; then
              return 1
            fi
          }

          capture_device() {
            local device_name="$1"
            local label="$2"
            capture_locale "$device_name" "$label" "en"
            capture_locale "$device_name" "$label" "ja" -AppleLanguages "(ja)" -AppleLocale "ja_JP"
          }

          APP_STORE_DEVICE_NAME="$(choose_app_store_device)"
          echo "Capturing App Store screenshots on $APP_STORE_DEVICE_NAME"
          capture_device "$APP_STORE_DEVICE_NAME" "iphone-app-store"
          validate_app_store_screenshot_sizes

          test -s "$SCREENSHOT_DIR/iphone-app-store-en/setup.png"
          cp "$SCREENSHOT_DIR/iphone-app-store-en/setup.png" "$SCREENSHOT_PATH"
          test -s "$SCREENSHOT_PATH"
          file "$SCREENSHOT_PATH"
          shasum -a 256 "$SCREENSHOT_PATH"

      - name: Commit latest App Store screenshots
        run: |
          set -euo pipefail
          mkdir -p ci-screenshots
          rm -rf ci-screenshots/app-store-ja ci-screenshots/app-store-en
          mkdir -p ci-screenshots/app-store-ja ci-screenshots/app-store-en
          for screen in setup home confirmation activeLock composeRepeat; do
            cp "$SCREENSHOT_DIR/iphone-app-store-ja/$screen.png" "ci-screenshots/app-store-ja/$screen.png"
            cp "$SCREENSHOT_DIR/iphone-app-store-en/$screen.png" "ci-screenshots/app-store-en/$screen.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-screenshots/app-store-ja ci-screenshots/app-store-en
          if ! git diff --cached --quiet; then
            git commit -m "Update App Store screenshots [skip ci]"
            git push
          fi

      - name: Assert mock UI e2e passed
        if: env.RUN_MOCK_E2E == 'true'
        run: |
          if compgen -G "artifacts/e2e-*.failed" > /dev/null || compgen -G "artifacts/missing-*.failed" > /dev/null; then
            echo "Mock UI e2e failures:"
            ls -1 artifacts/*.failed
            mkdir -p ci-screenshots
            {
              echo "Mock UI e2e failures:"
              ls -1 artifacts/*.failed
              echo
              for log in artifacts/xcodebuild-ui-e2e*.log; do
                echo "===== $log ====="
                tail -n 160 "$log"
                echo
              done
            } > ci-screenshots/latest-e2e-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-screenshots/latest-e2e-failure.log
            git commit -m "Update latest e2e failure log [skip ci]" || true
            git push || true
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearlock-ios-ci-artifacts
          path: |
            artifacts/*.failed
            artifacts/*.log
            artifacts/*.png
            artifacts/e2e-screenshots/*.png
            artifacts/screenshots/**/*.png
          if-no-files-found: warn
