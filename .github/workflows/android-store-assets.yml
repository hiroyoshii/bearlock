name: Android Store Assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-store-assets.yml'
      - 'android-lab/scripts/store_screenshots.py'
      - 'android-lab/product/**'
permissions:
  contents: read
concurrency:
  group: android-store-assets
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build screenshot app
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          ./android-lab/gradlew -p android-lab :product:assembleDebug --console=plain
          python3 -m pip install Pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Japanese and English screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            adb install -r android-lab/product/build/outputs/apk/debug/product-debug.apk
            python3 android-lab/scripts/store_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: bearlock-android-store-assets
          path: ci-screenshots/android-store/
          if-no-files-found: error
